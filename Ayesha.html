<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Proposal ❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: "Georgia", serif;
  color: white;
}

/* cinematic dark overlay */
.overlay {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(0,0,0,0.4), rgba(0,0,0,0.95));
}

/* floating hearts */
.heart {
  position: absolute;
  color: rgba(255, 80, 120, 0.7);
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}

/* main card */
.card {
  text-align: center;
  z-index: 2;
  padding: 40px;
  animation: fadeIn 3s ease-in-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

h1 {
  font-size: 2.5rem;
  color: #ff4d6d;
  text-shadow: 0 0 20px #ff4d6d;
  margin-bottom: 20px;
}

p {
  font-size: 18px;
  opacity: 0.8;
}

.buttons {
  margin-top: 25px;
}

button {
  padding: 12px 28px;
  margin: 10px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.yes {
  background: linear-gradient(45deg, #ff4d6d, #ffb3c1);
  color: white;
  box-shadow: 0 0 20px #ff4d6d;
}

.no {
  background: transparent;
  border: 2px solid white;
  color: white;
  position: absolute;
}

.yes:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">
  <h1>"In every lifetime… I would still choose you."</h1>
  <p>So today I ask you something from my heart...</p>
  <h2 style="color:white;">Will you be mine forever, Ayesha? ❤️</h2>

  <div class="buttons">
    <button class="yes" onclick="yes()">Yes 💖</button>
    <button class="no" id="noBtn">No 💔</button>
  </div>
</div>

<script>
// floating hearts generator
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.fontSize = (10 + Math.random() * 20) + "px";
  heart.style.animationDuration = (3 + Math.random() * 5) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}
setInterval(createHeart, 300);

// moving NO button
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 100);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
});

// YES action (cinematic reveal)
function yes() {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background: radial-gradient(circle, #1a1a1a, black);
      color:white;
      text-align:center;
      font-family:Georgia;
    ">
      <h1 style="color:#ff4d6d; font-size:3rem; text-shadow:0 0 25px #ff4d6d;">
        She said YES ❤️
      </h1>
      <p style="font-size:20px; opacity:0.8;">
        This is the beginning of our forever…
      </p>
    </div>
  `;
}
</script>

</body>
</html>
